		body {
			margin: 0;
			padding: 0;
			overflow: hidden;
			font-family: Arial, sans-serif;
		}
	</style>
</head>

<body>
	<div id="menu-btn">☰</div>

	<!-- Sidebar -->
	<div id="project-sidebar" class="sidebar">

		<h2>Projects</h2>

		<a href="../..">🏠 Landing</a>
		<a href="../project1/">Project 1</a>
		<a href="../geometries-project2/">Project 2</a>

	<!-- UI Overlay -->
	<div id="ui-overlay">
		<label>Handle Width</label>
		<input type="range" id="handleWidth" min="40" max="150" value="90">

		<label>Handle Height</label>
		<input type="range" id="handleHeight" min="150" max="2000" value="250">

		<label>Handle Position</label>
		<input type="range" id="handlePosition" min="0" max="2000" value="1000">

		<label>Sides</label>
		<div class="inline-toggles">
			<label><input type="radio" name="side" id="left" value="0" checked> Left</label>
			<label><input type="radio" name="side" id="right" value="1"> Right</label>
			<label><input type="radio" name="side" id="top" value="2"> Top</label>
			<label><input type="radio" name="side" id="bottom" value="3"> Bottom</label>
		</div>

		<label>
			<input type="checkbox" id="backside"> Backside
		</label>

		<label>View Mode</label>
		<div class="radio-group">
			<label><input type="radio" name="viewMode" value="normal" checked> Normal</label>
			<label><input type="radio" name="viewMode" value="realistic"> Realistic</label>
		</div>
	</div>

	<script type="module" src="./main.ts"></script>
	<script>
		const menuBtn = document.getElementById("menu-btn");
		const sidebar = document.getElementById("project-sidebar");

		menuBtn.addEventListener("click", () => {
			sidebar.classList.toggle("open");
			document.body.classList.toggle("sidebar-open");
		});
	</script>

</body>

</html>
